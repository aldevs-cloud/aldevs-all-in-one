<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>aldevs</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="apple-touch-icon" href="assets/logo.png" />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg: #000000;
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.62);
    --line: rgba(255,255,255,0.16);
    --font: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100%;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: clamp(40px, 8vh, 88px) 20px 72px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Hero ---------- */

  .hero{
    opacity:0;
    transform: scale(.9);
    animation: hero-in .6s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .hero-mark{
    width: 84px;
    height: 84px;
    border-radius: 26%;
    display:block;
  }

  @keyframes hero-in{
    to{ opacity:1; transform: scale(1); }
  }

  /* ---------- App list ---------- */

  .apps{
    width:100%;
    max-width: 640px;
    margin-top: clamp(40px, 7vh, 72px);
    display:flex;
    flex-direction:column;
    border-top: 1px solid var(--line);
    opacity:0;
    animation: list-in .5s ease .25s forwards;
  }

  @keyframes list-in{
    to{ opacity:1; }
  }

  .app{
    display:block;
    padding: clamp(18px, 3.2vw, 26px) 4px;
    border-bottom: 1px solid var(--line);
    color: var(--text-dim);
    text-decoration:none;
    font-size: clamp(26px, 5.4vw, 40px);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
    transition: color .2s ease, background-color .2s ease, padding .25s cubic-bezier(.2,.8,.2,1);
  }

  .app:hover,
  .app:focus-visible{
    background: var(--text);
    color: var(--bg);
    padding-left: 20px;
    padding-right: 20px;
  }

  .app:active{
    opacity: .85;
  }

  .app:focus-visible{
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  @media (hover: none){
    .app{ color: var(--text); }
  }

  @media (prefers-reduced-motion: reduce){
    .hero, .apps{ animation: none !important; opacity:1 !important; transform:none !important; }
    .app{ transition:none; }
  }
</style>
</head>
<body>

  <div class="hero">
    <img class="hero-mark" src="assets/logo.png" alt="Aldevs" />
  </div>

  <nav class="apps" id="apps" aria-label="Apps"></nav>

  <script>
    // ============================================================
    // Notun app add korte shudhu ekta line add koro:
    //   { name: "App er nam", url: "https://..." },
    // ============================================================
    const APPS = [
      { name: "Duty Log",         url: "https://aldevs-cloud.github.io/duty-log/" },
      { name: "Class Board",      url: "https://aldevs-cloud.github.io/class-board/" },
      { name: "Khorochnama",      url: "https://aldevs-cloud.github.io/khorochnama/" },
      { name: "Khoroch Ledger",   url: "https://aldevs-cloud.github.io/khoroch-ledger/" },
      { name: "Somoy Calculator", url: "https://aldevs-cloud.github.io/time-calculator/" },
      { name: "Hishaber Khata",   url: "https://aldevs-cloud.github.io/hishaber-khata/" },
      { name: "Tour Planner",     url: "https://aldevs-cloud.github.io/tour-planner/" },
      { name: "Pocket",           url: "https://aldevs-cloud.github.io/pocket/" },
      { name: "SourceBoard",      url: "https://aldevs-cloud.github.io/source-board/" },
    ];

    const list = document.getElementById("apps");

    APPS.forEach(app => {
      const a = document.createElement("a");
      a.className = "app";
      a.href = app.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = app.name;
      list.appendChild(a);
    });
  </script>

</body>
</html>
